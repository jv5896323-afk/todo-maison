<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Liste de Ménage</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="container">

    <!-- PAGE D'ACCUEIL : 4 pièces -->
    <div id="home-screen">
      <header>
        <h1>Ma Liste de Ménage</h1>
        <p class="subtitle">Choisissez une pièce</p>
      </header>
      <div class="rooms-grid">
        <div class="room-card" onclick="openRoom('chambre1')">
          <div class="room-icon">🛏️</div>
          <div class="room-name">Chambre 1</div>
          <div class="room-progress" id="progress-chambre1"></div>
        </div>
        <div class="room-card" onclick="openRoom('chambre2')">
          <div class="room-icon">🛏️</div>
          <div class="room-name">Chambre 2</div>
          <div class="room-progress" id="progress-chambre2"></div>
        </div>
        <div class="room-card" onclick="openRoom('salon')">
          <div class="room-icon">🛋️</div>
          <div class="room-name">Salon</div>
          <div class="room-progress" id="progress-salon"></div>
        </div>
        <div class="room-card" onclick="openRoom('cuisine')">
          <div class="room-icon">🍳</div>
          <div class="room-name">Cuisine</div>
          <div class="room-progress" id="progress-cuisine"></div>
        </div>
      </div>
    </div>

    <!-- PAGE D'UNE PIÈCE -->
    <div id="room-screen" style="display:none">
      <header class="room-header">
        <h1 id="room-title"></h1>
        <div class="filters">
          <button class="filter-btn active" data-filter="quotidien" onclick="toggleFilter('quotidien')">Quotidien</button>
          <button class="filter-btn active" data-filter="hebdomadaire" onclick="toggleFilter('hebdomadaire')">Hebdomadaire</button>
          <button class="filter-btn active" data-filter="mensuel" onclick="toggleFilter('mensuel')">Mensuel</button>
        </div>
      </header>

      <div class="stats">
        <span id="stats-text">0 / 0 tâches accomplies</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="add-task-form">
        <input type="text" id="new-task" placeholder="Ajouter une tâche..." autocomplete="off">
        <div class="add-row">
          <select id="new-freq">
            <option value="quotidien">Quotidien</option>
            <option value="hebdomadaire">Hebdomadaire</option>
            <option value="mensuel">Mensuel</option>
          </select>
          <button id="add-btn">+</button>
        </div>
      </div>

      <div id="task-list"></div>

      <div class="actions">
        <button id="reset-all" class="action-btn danger">Réinitialiser les tâches</button>
      </div>

      <div class="bottom-bar">
        <button class="back-btn" onclick="goHome()">&#8592; Retour</button>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
